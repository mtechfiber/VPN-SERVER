    <div class="field">
        <label>Password</label>
        <div class="pass-wrap">
            <input id="password" type="password" placeholder="Password" autocomplete="off">
            <button type="button" class="pass-toggle" id="passToggleBtn" onclick="toggleLoginPassword()">Show</button>
        </div>
    </div>

    <button class="login-btn" onclick="clientLogin()">LOGIN</button>

    
<div class="login-help-text">
    Need help? Contact support for VPN setup or connection issues.

    </div>

<script>
function toggleLoginPassword(){
    let pass = document.getElementById("password");
    let btn = document.getElementById("passToggleBtn");

    if(pass.type === "password"){
        pass.type = "text";
        btn.innerText = "Hide";
    }else{
        pass.type = "password";
        btn.innerText = "Show";
    }
}

async function loadClients(){
    try{
        let res = await fetch("/api/clients_store.php?ts=" + Date.now(), {cache:"no-store"});
        let data = await res.json();

        if(data.ok && Array.isArray(data.clients)){
            return data.clients;
        }
    }catch(e){}

    return [];
}

async function clientLogin(){
    let u = document.getElementById("username").value.trim();
    let p = document.getElementById("password").value.trim();

    if(!u || !p){
        alert("Please enter username and password");
        return;
    }

    let clients = await loadClients();

    let found = clients.find(c => {
        let userOk = String(c.username || "").trim() === u;
        let portalPass = String(c.portalPassword || "").trim();
        let oldPass = String(c.password || "").trim();
        let passOk = portalPass ? (portalPass === p) : (oldPass === p);
        return userOk && passOk;
    });

    if(!found){
        alert("Invalid client login");
        return;
    }

    localStorage.setItem("vpnLoggedIn","yes");
    localStorage.setItem("vpnRole","client");
    localStorage.setItem("vpnLoginUser",u);

    location.href = "/client2.html?v=" + Date.now();
}

document.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        clientLogin();
    }
});

document.addEventListener("DOMContentLoaded", function(){
    if(localStorage.getItem("vpnLoggedIn") === "yes" && localStorage.getItem("vpnRole") === "client"){
        location.href = "/client2.html?v=" + Date.now();
    }
});
</script>

<script>
/* LOGIN FINAL REBUILD CLEAN */
(function(){
    let done = false;

    function norm(s){
        return (s || "").toString().trim().replace(/\s+/g," ").toUpperCase();
    }

    function visible(el){
        if(!el) return false;
        const st = window.getComputedStyle(el);
        return st.display !== "none" &&
               st.visibility !== "hidden" &&
               st.opacity !== "0" &&
               el.offsetWidth > 0 &&
               el.offsetHeight > 0;
    }

    function findLoginButton(scope){
        return Array.from(scope.querySelectorAll("button,input[type='submit']")).find(function(btn){
            let t = norm(btn.textContent || btn.value || "");
            return visible(btn) && (t.includes("LOGIN") || t.includes("SIGN IN"));
        });
    }

    function findPassword(scope){
        return Array.from(scope.querySelectorAll("input")).find(function(i){
            let type = ((i.getAttribute("type") || i.type || "") + "").toLowerCase();
            let ph = norm(i.placeholder);
            let id = norm(i.id);
            let name = norm(i.name);

            return visible(i) && (
                type === "password" ||
                ph.includes("PASSWORD") ||
                id.includes("PASS") ||
                name.includes("PASS")
            );
        });
    }

    function findUser(scope, pass){
        return Array.from(scope.querySelectorAll("input")).find(function(i){
            let type = ((i.getAttribute("type") || i.type || "") + "").toLowerCase();
            return i !== pass &&
                   visible(i) &&
                   type !== "hidden" &&
                   type !== "submit" &&
                   type !== "checkbox";
        });
    }

    function findScope(){
        let forms = Array.from(document.querySelectorAll("form"));

        for(let form of forms){
            let pass = findPassword(form);
            let btn = findLoginButton(form);

            if(pass && btn){
                return form;
            }
        }

        let pass = findPassword(document);
        if(!pass) return null;

        let candidates = [
            pass.closest(".login-card"),
            pass.closest(".login-box"),
            pass.closest(".auth-card"),
            pass.closest(".card"),
            pass.closest(".panel"),
            pass.closest("form"),
            pass.parentElement
        ].filter(Boolean);

        for(let c of candidates){
            if(findLoginButton(c)){
                return c;
            }
        }

        return null;
    }

    function removeOldShowButtons(scope){
        Array.from(scope.querySelectorAll("button")).forEach(function(btn){
            let t = norm(btn.textContent);
            if(t === "SHOW" || t === "HIDE"){
                btn.remove();
            }
        });
    }

    function cleanBuild(){
        if(done) return;

        let scope = findScope();
        if(!scope) return;

        let pass = findPassword(scope);
        let user = findUser(scope, pass);
        let loginBtn = findLoginButton(scope);

        if(!pass || !user || !loginBtn) return;

        done = true;

        document.body.classList.add("login-final-rebuild-page");

        let isAdmin = location.pathname.toLowerCase().includes("/admin");
        let title = isAdmin ? "ADMIN PORTAL" : "VPN SERVER";

        document.title = title;

        let card = scope;
        card.classList.add("login-final-rebuild-card");

        removeOldShowButtons(scope);

        let oldChildren = Array.from(card.children);

        let ui = document.createElement("div");
        ui.className = "login-final-ui";
        ui.innerHTML = `
            <div class="login-final-hero">
                <div class="login-final-logo">🛡️</div>
                <h1 class="login-final-title">${title}</h1>
                <p class="login-final-subtitle">Secure Remote Access</p>
                <p class="login-final-welcome">Welcome back! Please login to your account.</p>
            </div>

            <label class="login-final-label">Username</label>
            <div class="login-final-input-wrap" id="loginFinalUserWrap"></div>

            <label class="login-final-label">Password</label>
            <div class="login-final-input-wrap login-final-pass-wrap" id="loginFinalPassWrap"></div>

            <div id="loginFinalButtonWrap"></div>

            <div class="login-final-helpbox">
                <div class="login-final-help-icon">🎧</div>
                <div>
                    <p class="login-final-help-title">Need help?</p>
                    <p class="login-final-help-text">
                        Contact support for VPN setup<br>
                        or connection issues.<br><br>
                        Contact us: <a href="https://www.facebook.com/marvinqmarvida" target="_blank" rel="noopener">MarvinConfiguration</a>
                    </p>
                </div>
            </div>
        `;

        card.appendChild(ui);

        oldChildren.forEach(function(child){
            if(child !== ui){
                child.classList.add("login-final-hidden-old");
            }
        });

        user.placeholder = "Enter your username";
        pass.placeholder = "Enter your password";

        document.getElementById("loginFinalUserWrap").appendChild(user);
        document.getElementById("loginFinalPassWrap").appendChild(pass);

        let showBtn = document.createElement("button");
        showBtn.type = "button";
        showBtn.id = "loginFinalShowBtn";
        showBtn.textContent = "Show";
        showBtn.onclick = function(e){
            e.preventDefault();
            e.stopPropagation();

            pass.type = pass.type === "password" ? "text" : "password";
            showBtn.textContent = pass.type === "text" ? "Hide" : "Show";
        };

        document.getElementById("loginFinalPassWrap").appendChild(showBtn);

        loginBtn.classList.add("login-final-login-btn");

        if(loginBtn.tagName === "INPUT"){
            loginBtn.value = "LOGIN";
        }else{
            loginBtn.textContent = "LOGIN";
        }

        document.getElementById("loginFinalButtonWrap").appendChild(loginBtn);

        pass.style.setProperty("padding-right","84px","important");
    }

    document.addEventListener("DOMContentLoaded", function(){
        cleanBuild();
        setTimeout(cleanBuild,300);
        setTimeout(cleanBuild,1000);
        setTimeout(cleanBuild,2000);
    });

    window.addEventListener("pageshow", function(){
        setTimeout(cleanBuild,300);
    });
})();
</script>

<script>
/* RESTORE VISIBLE LOGIN BUTTON FINAL */
(function(){
    function norm(s){
        return (s || "").toString().trim().replace(/\s+/g," ").toUpperCase();
    }

    function visible(el){
        if(!el) return false;
        const st = window.getComputedStyle(el);
        return st.display !== "none" &&
               st.visibility !== "hidden" &&
               st.opacity !== "0" &&
               el.offsetWidth > 0 &&
               el.offsetHeight > 0;
    }

    function findCard(){
        return document.querySelector(".login-final-rebuild-card") ||
               document.querySelector(".login-clean-final-card") ||
               document.querySelector(".vpn-login-card-skin") ||
               document.querySelector(".login-card") ||
               document.querySelector(".login-box") ||
               document.querySelector(".auth-card") ||
               document.querySelector("form") ||
               document.body;
    }

    function findOriginalLogin(card){
        const buttons = Array.from(card.querySelectorAll("button,input[type='submit']"));

        return buttons.find(function(btn){
            if(btn.id === "loginFinalVisibleBtn") return false;

            let t = norm(btn.textContent || btn.value || "");
            return t.includes("LOGIN") || t.includes("SIGN IN");
        });
    }

    function doOriginalLogin(){
        let card = findCard();
        let original = findOriginalLogin(card);

        if(original){
            original.click();
            return;
        }

        let form =
            card.closest("form") ||
            card.querySelector("form") ||
            document.querySelector("form");

        if(form){
            if(typeof form.requestSubmit === "function"){
                form.requestSubmit();
            }else{
                form.submit();
            }
            return;
        }

        // fallback sa possible old login functions
        if(typeof login === "function"){
            login();
            return;
        }

        if(typeof adminLogin === "function"){
            adminLogin();
            return;
        }

        if(typeof doLogin === "function"){
            doLogin();
            return;
        }

        alert("Login function not found. Please press Enter after password.");
    }

    function restoreLoginButton(){
        let card = findCard();
        if(!card) return;

        let existingVisibleLogin = Array.from(card.querySelectorAll("button,input[type='submit']")).find(function(btn){
            if(btn.id === "loginFinalVisibleBtn") return false;
            let t = norm(btn.textContent || btn.value || "");
            return visible(btn) && (t.includes("LOGIN") || t.includes("SIGN IN"));
        });

        if(existingVisibleLogin){
            existingVisibleLogin.classList.add("login-final-login-btn");
            return;
        }

        let btn = document.getElementById("loginFinalVisibleBtn");

        if(!btn){
            btn = document.createElement("button");
            btn.type = "button";
            btn.id = "loginFinalVisibleBtn";
            btn.textContent = "LOGIN";
            btn.onclick = function(e){
                e.preventDefault();
                doOriginalLogin();
            };
        }

        let help = card.querySelector(".login-final-helpbox") ||
                   card.querySelector(".login-clean-helpbox") ||
                   card.querySelector(".vpn-login-helpbox");

        if(help){
            help.parentNode.insertBefore(btn, help);
        }else{
            card.appendChild(btn);
        }
    }

    document.addEventListener("DOMContentLoaded", function(){
        restoreLoginButton();
        setTimeout(restoreLoginButton,300);
        setTimeout(restoreLoginButton,1000);
        setTimeout(restoreLoginButton,2000);
    });

    window.addEventListener("pageshow", function(){
        setTimeout(restoreLoginButton,300);
    });
})();
</script>

<script>

(function(){
    const BRAND_LOGO = "/uploads/portal-brand-logo.png?v=1782855652";
    const FALLBACK_LOGO = "/uploads/vpn-logo.png?v=1782855652";

    function setFavicon(rel, href, type){
        let link = document.querySelector('link[rel="' + rel + '"]');

        if(!link){
            link = document.createElement("link");
            link.rel = rel;
            document.head.appendChild(link);
        }

        if(type) link.type = type;
        link.href = href;
    }

    function applyFinalBrandingLogo(){
        document.querySelectorAll(".login-final-logo, .login-clean-logo, .vpn-login-logo").forEach(function(el){
            el.innerHTML = '<img src="' + BRAND_LOGO + '" alt="VPN Logo" onerror="this.onerror=null;this.src=\'' + FALLBACK_LOGO + '\';">';
        });

        setFavicon("icon", "/favicon.png?v=1782855652", "image/png");
        setFavicon("shortcut icon", "/favicon.ico?v=1782855652");
        setFavicon("apple-touch-icon", "/apple-touch-icon.png?v=1782855652");
    }

    document.addEventListener("DOMContentLoaded", function(){
        applyFinalBrandingLogo();
        setTimeout(applyFinalBrandingLogo,300);
        setTimeout(applyFinalBrandingLogo,1000);
        setTimeout(applyFinalBrandingLogo,2000);
        setTimeout(applyFinalBrandingLogo,4000);
    });

    window.addEventListener("pageshow", function(){
        setTimeout(applyFinalBrandingLogo,300);
        setTimeout(applyFinalBrandingLogo,1000);
    });

    // lock para hindi na maibalik ng old late scripts
    setInterval(applyFinalBrandingLogo, 2000);
})();
</script>
