<script>
/* CLIENT AUTO VPN NAME FINAL */
(function(){
    if(window.__clientAutoVpnNameFinal) return;
    window.__clientAutoVpnNameFinal = true;

    function clean(s){
        return (s || "").toString().trim().replace(/\s+/g," ");
    }

    function getClientName(){
        if(window.clientPaidGenGetClientName){
            const n = clean(window.clientPaidGenGetClientName());
            if(n) return n;
        }

        const lines = (document.body.innerText || "").split(/\n+/);

        for(const line of lines){
            const m = clean(line).match(/^Hi,\s*([A-Za-z0-9._-]+)/i);
            if(m && m[1]) return clean(m[1]);
        }

        return "";
    }

    function visibleNamesFallback(){
        const names = [];
        const table = Array.from(document.querySelectorAll("table")).find(function(t){
            const h = (t.querySelector("thead")?.innerText || "").toUpperCase();
            return h.includes("WINBOX NAME") || h.includes("VPN ADDRESS");
        });

        if(!table) return names;

        table.querySelectorAll("tbody tr").forEach(function(row){
            const first = row.children[0];
            if(!first) return;

            const txt = clean(first.innerText || "");
            const firstLine = clean(txt.split(/\n/)[0] || "");

            if(firstLine) names.push(firstLine);
        });

        return names;
    }

    function computeNextLocal(client, names){
        client = clean(client);
        names = names.map(clean).filter(Boolean);

        let base = client.replace(/\d+$/,"");
        if(!base) base = client || "vpn";

        const groups = {};

        names.forEach(function(n){
            const m = n.match(/^(.+?)(\d+)$/);
            if(!m) return;

            const prefix = m[1];
            const num = parseInt(m[2],10);

            if(!groups[prefix]) groups[prefix] = {count:0,max:0};

            groups[prefix].count++;
            if(num > groups[prefix].max) groups[prefix].max = num;
        });

        if(groups[base]){
            return base + (groups[base].max + 1);
        }

        let best = null;

        Object.keys(groups).forEach(function(prefix){
            if(!best || groups[prefix].count > groups[best].count || groups[prefix].max > groups[best].max){
                best = prefix;
            }
        });

        if(best){
            return best + (groups[best].max + 1);
        }

        return base + "1";
    }

    async function fillAutoVpnName(){
        const input = document.getElementById("clientPaidGenUser");
        if(!input) return;

        const client = getClientName();
        if(!client) return;

        input.readOnly = true;
        input.placeholder = "Auto VPN Name...";
        input.style.pointerEvents = "none";

        try{
            const res = await fetch("/api/client_next_vpn_name.php?client=" + encodeURIComponent(client) + "&v=" + Date.now(), {
                cache:"no-store"
            });

            const data = await res.json();

            if(data && data.ok && data.next){
                input.value = data.next;
            }else{
                input.value = computeNextLocal(client, visibleNamesFallback());
            }
        }catch(e){
            input.value = computeNextLocal(client, visibleNamesFallback());
        }

        const box = input.closest(".client-paid-gen-field") || input.parentElement;

        if(box && !box.querySelector(".client-auto-vpn-name-note")){
            const note = document.createElement("div");
            note.className = "client-auto-vpn-name-note";
            note.textContent = "Auto VPN Name: susunod na number ang gagamitin.";
            box.appendChild(note);
        }
    }

    function relabel(){
        const input = document.getElementById("clientPaidGenUser");
        if(!input) return;

        const box = input.closest(".client-paid-gen-field") || input.parentElement;
        if(!box) return;

        const label = box.querySelector("label");
        if(label) label.textContent = "VPN Name (Auto)";
    }

    function apply(){
        relabel();
        fillAutoVpnName();
    }

    document.addEventListener("DOMContentLoaded", function(){
        setTimeout(apply, 400);
        setTimeout(apply, 1200);
    });

    document.addEventListener("click", function(e){
        const t = e.target;

        if(
            t.closest("#clientGenerateVpnBtn") ||
            t.closest("#clientPaidGenModal") ||
            t.closest("#clientPaidGenSubmit")
        ){
            setTimeout(apply, 200);
        }
    }, true);
})();
</script>

<script>
/* SAFE PAYMENT CONFIRMATION BUTTON FINAL */
(function(){
    if(window.__safePaymentConfirmationButtonFinal) return;
    window.__safePaymentConfirmationButtonFinal = true;

    const FB_PROFILE = "https://facebook.com/marvinqmarvida";

    function addPaymentConfirmation(){
        const modal = document.getElementById("clientFundModal");
        if(!modal) return;

        if(modal.querySelector("#clientPaymentConfirmBtn")) return;

        const btn = document.createElement("a");
        btn.id = "clientPaymentConfirmBtn";
        btn.href = FB_PROFILE;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
        btn.textContent = "Payment Confirmation";

        const note = document.createElement("div");
        note.className = "client-payment-confirm-note";
        note.textContent = "After payment, send screenshot/proof to my Facebook profile.";

        const closeBtn = Array.from(modal.querySelectorAll("button,a")).find(function(el){
            return (el.textContent || "").trim().toLowerCase() === "close";
        });

        if(closeBtn && closeBtn.parentElement){
            closeBtn.parentElement.insertBefore(btn, closeBtn);
            closeBtn.parentElement.insertBefore(note, closeBtn);
        }else{
            modal.appendChild(btn);
            modal.appendChild(note);
        }
    }

    document.addEventListener("DOMContentLoaded", function(){
        addPaymentConfirmation();
    });

    document.addEventListener("click", function(e){
        if(e.target.closest("#clientAddFundBtn")){
            setTimeout(addPaymentConfirmation, 150);
        }
    });
})();
</script>
