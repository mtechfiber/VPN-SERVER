<div class="app">
    <div class="header">
        <div>
            <h1>VPN Portal</h1>

        </div>

    <div class="panel">
        <div class="tools">
            <input id="searchBox" type="text" placeholder="Search VPN name..." oninput="render()">
        </div>

            <table>
                <thead>
                    <tr>
                        <th>WINBOX NAME</th>
                        <th>VPN Address</th>
                        <th>Script</th>
                        <th>Online</th>
                        <th>Uptime</th>
                        <th>Day Left</th>
                        <th>Enable / Disable</th>
                        
                    </tr>
                </thead>
                <tbody id="vpnTable">
                    <tr><td colspan="7">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="scriptModal" class="modal">
    <div class="modal-box">
        <h2>VPN Script</h2>
        <textarea id="scriptOutput" readonly></textarea>
        <div class="modal-actions">
            <button class="btn" onclick="closeScript()">Close</button>
            <button class="btn" onclick="copyScript()">Copy</button>
        </div>
    </div>
</div>

<script>
let loginUser = localStorage.getItem("vpnLoginUser") || "";
let role = localStorage.getItem("vpnRole") || "";
let clients = [];
let myVpns = [];
let statusCache = {};

if(localStorage.getItem("vpnLoggedIn") !== "yes" || role !== "client"){
    location.href = "/?v=client-login";
}

function logout(){
    localStorage.removeItem("vpnLoggedIn");
    localStorage.removeItem("vpnRole");
    localStorage.removeItem("vpnLoginUser");
    location.href = "/?v=logout";
}

function getVpnNames(client){
    if(Array.isArray(client.vpnNames)) return client.vpnNames;
    if(typeof client.vpnNames === "string"){
        return client.vpnNames.split(/[\n,]+/).map(x => x.trim()).filter(Boolean);
    }
    return [];
}

async function loadClients(){
    try{
        let res = await fetch("api/clients_store.php?ts=" + Date.now(), {cache:"no-store"});
        let data = await res.json();
        if(data.ok && Array.isArray(data.clients)){
            clients = data.clients;
        }
    }catch(e){
        clients = JSON.parse(localStorage.getItem("vpnClients") || "[]");
    }

    let me = clients.find(c => String(c.username || "").trim() === loginUser);

    if(!me){
        myVpns = [];
        return;
    }

    myVpns = getVpnNames(me);
}

function safeId(text){
    return btoa(unescape(encodeURIComponent(text))).replace(/=/g,"");
}

async function getTargetChr(vpnName){
    try{
        let res = await fetch("api/target_one.php?vpnName=" + encodeURIComponent(vpnName) + "&ts=" + Date.now(), {cache:"no-store"});
        let data = await res.json();
        if(data.ok && data.chr) return data.chr;
    }catch(e){}
    return "chr2";
}

async function getComment(vpnName, chr){
    let domain = chr === "chr1" ? "vpn.marvincloud1.link" : "vpn.marvincloud2.link";
    let port = "0000";
    let comment = vpnName + " | WINBOX: 0000 | EXP: UNKNOWN";

    try{
        let res = await fetch("api/get_secret_comment.php", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            cache:"no-store",
            body:JSON.stringify({vpnName, chr})
        });

        let data = await res.json();

        if(data.ok){
            if(data.domain) domain = data.domain;
            if(data.port) port = data.port;
            if(data.comment) comment = data.comment;
        }
    }catch(e){}

    return {domain, port, comment};
}

async function getStatus(vpnName){
    try{
        let res = await fetch("api/vpn_status_one.php", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            cache:"no-store",
            body:JSON.stringify({vpnName})
        });

        let data = await res.json();
        statusCache[vpnName] = data;
        return data;
    }catch(e){
        let data = {ok:false,error:e.message,dayLeftText:"ERROR",expired:false,online:false,enabled:false};
        statusCache[vpnName] = data;
        return data;
    }
}

function render(){
    let q = (document.getElementById("searchBox").value || "").toLowerCase();
    let list = myVpns.filter(v => v.toLowerCase().includes(q));
    let tbody = document.getElementById("vpnTable");

    if(list.length === 0){
        tbody.innerHTML = `<tr><td colspan="7">No VPN found.</td></tr>`;
        document.getElementById("totalVpn").innerText = myVpns.length;
        document.getElementById("totalOnline").innerText = "0";
        document.getElementById("totalOffline").innerText = "0";
        return;
    }

    tbody.innerHTML = list.map(vpn => {
        let id = safeId(vpn);
        return `
            <tr>
                <td>
                    <div class="vpn-name-wrap">
                        <div class="vpn-name-line">
                            <span class="vpn-name" id="nick_${id}" data-vpn="${vpn}">${vpn}</span>
                            <button class="nick-edit-btn" type="button" onclick="openNicknameModal('${encodeURIComponent(vpn)}')">Edit</button>
                        </div>
                        <div class="vpn-real-name" id="real_${id}"></div>
                    </div>
                </td>
                <td><span class="addr" title="Click to copy" id="addr_${id}" onclick="copyAddress('${id}')">Loading...</span></td>
                <td><button class="btn" id="script_${id}" onclick="openScript('${encodeURIComponent(vpn)}')">Script</button></td>
                <td><span class="badge checking" id="online_${id}">CHECKING</span></td>
                <td><span class="uptime-badge uptime-offline" id="uptime_${id}">CHECKING</span></td>
                <td><span class="day-badge checking" id="day_${id}">CHECKING</span></td>
                <td>
                    <label class="toggle">
                        <input type="checkbox" id="toggle_${id}" onchange="toggleVpn('${encodeURIComponent(vpn)}', this)">
                        <span class="slider"></span>
                    </label>
                </td>
            </tr>
        `;
    }).join("");

    document.getElementById("totalVpn").innerText = myVpns.length;

    list.forEach(vpn => loadRow(vpn));
}

async function loadRow(vpnName){
    let id = safeId(vpnName);
    let addrEl = document.getElementById("addr_" + id);
    let onlineEl = document.getElementById("online_" + id);
    let dayEl = document.getElementById("day_" + id);
    let toggleEl = document.getElementById("toggle_" + id);
    let scriptBtn = document.getElementById("script_" + id);

    let chr = await getTargetChr(vpnName);
    let commentData = await getComment(vpnName, chr);

    if(addrEl){
        addrEl.innerText = commentData.domain + ":" + commentData.port;
        addrEl.setAttribute("data-copy", commentData.domain + ":" + commentData.port);
    }

    let data = await getStatus(vpnName);

    if(onlineEl){
        if(data.ok && data.online){
            onlineEl.className = "badge online";
            onlineEl.innerText = "ONLINE";
        }else{
            onlineEl.className = "badge offline";
            onlineEl.innerText = data.ok ? "OFFLINE" : "ERROR";
        }
    }

    if(dayEl){
        let text = data.dayLeftText || "";

        if(!text){
            if(data.expired){
                text = "EXPIRED";
            }else if(data.daysLeft !== null && data.daysLeft !== undefined){
                text = data.daysLeft + " day(s)";
            }else{
                text = "NO EXP";
            }
        }

        dayEl.innerText = text;

        if(text === "EXPIRED" || data.expired){
            dayEl.className = "day-badge day-expired";
        }else if(text === "NO EXP" || text === "ERROR"){
            dayEl.className = "day-badge day-none";
        }else{
            dayEl.className = "day-badge day-ok";
        }
    }

    let locked = !!data.expired;

    if(toggleEl){
        toggleEl.checked = !!data.enabled;
        toggleEl.disabled = locked || !data.ok;
    }

    if(scriptBtn){
        scriptBtn.disabled = locked || !data.ok;
        scriptBtn.innerText = locked ? "Expired" : "Script";
    }

    updateTotals();
}

function updateTotals(){
    let online = 0;
    let offline = 0;

    myVpns.forEach(vpn => {
        let data = statusCache[vpn];
        if(!data) return;

        if(data.ok && data.online) online++;
        else offline++;
    });

    document.getElementById("totalOnline").innerText = online;
    document.getElementById("totalOffline").innerText = offline;
}

async function toggleVpn(encoded, el){
    let vpnName = decodeURIComponent(encoded);
    let wanted = el.checked;

    el.disabled = true;

    try{
        let res = await fetch("api/vpn_toggle_one.php", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            cache:"no-store",
            body:JSON.stringify({vpnName, enabled:wanted})
        });

        let data = await res.json();

        if(!data.ok){
            alert(data.error || "Toggle failed");
        }

        await loadRow(vpnName);
    }catch(e){
        alert("Toggle error: " + e.message);
        await loadRow(vpnName);
    }
}

async function openScript(encoded){
    let vpnName = decodeURIComponent(encoded);
    let chr = await getTargetChr(vpnName);
    let data = await getComment(vpnName, chr);

    let password = "1";
    let me = clients.find(c => String(c.username || "").trim() === loginUser);
    if(me && me.password) password = me.password;

    document.getElementById("scriptOutput").value =
`/interface sstp-client
add connect-to=${data.domain} disabled=no name="VPN_REMOTE" password=${password} profile=default-encryption user="${vpnName}" comment="${data.comment}"

/ip firewall filter
add action=accept chain=input comment="ALLOW VPN REMOTE" in-interface="VPN_REMOTE"
add action=accept chain=forward comment="ALLOW VPN REMOTE" in-interface="VPN_REMOTE"`;

    document.getElementById("scriptModal").style.display = "flex";
}

function closeScript(){
    document.getElementById("scriptModal").style.display = "none";
}

async function copyScript(){
    let txt = document.getElementById("scriptOutput").value;
    await navigator.clipboard.writeText(txt);
    alert("Copied");
}

async function copyAddress(id){
    let el = document.getElementById("addr_" + id);
    let text = el.getAttribute("data-copy") || el.innerText;
    await navigator.clipboard.writeText(text);
    alert("Copied: " + text);
}

document.addEventListener("DOMContentLoaded", async function(){
    await loadClients();
    render();
    setInterval(() => {
        myVpns.forEach(vpn => loadRow(vpn));
    }, 30000);
});
</script>













<script>
/* SAFARI TOGGLE PATTERN FIX */
(function(){
    window.safeId = function(text){
        text = String(text || "");
        let out = "vpn_";

        for(let i = 0; i < text.length; i++){
            out += text.charCodeAt(i).toString(16).padStart(4, "0");
        }

        return out.slice(0, 90);
    };

    window.safeDecodeVpn = function(value){
        value = String(value || "");

        try{
            return decodeURIComponent(value);
        }catch(e){
            return value;
        }
    };

    window.toggleVpn = async function(encoded, el){
        let vpnName = window.safeDecodeVpn(encoded);
        let wanted = !!el.checked;

        el.disabled = true;

        try{
            let res = await fetch("api/vpn_toggle_one.php", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                cache:"no-store",
                body:JSON.stringify({
                    vpnName:vpnName,
                    enabled:wanted
                })
            });

            let text = await res.text();
            let data;

            try{
                data = JSON.parse(text);
            }catch(e){
                throw new Error("API returned invalid JSON: " + text.slice(0,120));
            }

            if(!data.ok){
                alert(data.error || "Toggle failed");
            }

            if(typeof loadRow === "function"){
                await loadRow(vpnName);
            }

        }catch(e){
            alert("Toggle error: " + e.message);

            if(typeof loadRow === "function"){
                await loadRow(vpnName);
            }else{
                el.disabled = false;
            }
        }
    };
})();
</script>

<div id="copyToast" class="copy-toast">Copied</div>

<script>
/* VPN ADDRESS AUTO COPY */
(function(){
    function showCopyToast(text){
        let toast = document.getElementById("copyToast");

        if(!toast){
            toast = document.createElement("div");
            toast.id = "copyToast";
            toast.className = "copy-toast";
            document.body.appendChild(toast);
        }

        toast.innerText = text || "Copied";
        toast.style.display = "block";

        clearTimeout(window.copyToastTimer);
        window.copyToastTimer = setTimeout(function(){
            toast.style.display = "none";
        }, 1400);
    }

    async function copyTextSafe(text){
        text = String(text || "").trim();

        if(!text || text === "Loading..."){
            showCopyToast("No address yet");
            return false;
        }

        try{
            if(navigator.clipboard && window.isSecureContext){
                await navigator.clipboard.writeText(text);
                return true;
            }
        }catch(e){}

        try{
            let ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            ta.style.top = "0";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, 99999);

            let ok = document.execCommand("copy");
            document.body.removeChild(ta);

            return ok;
        }catch(e){
            return false;
        }
    }

    window.copyAddress = async function(id){
        let el = document.getElementById("addr_" + id);

        if(!el){
            showCopyToast("Address not found");
            return;
        }

        let text = el.getAttribute("data-copy") || el.innerText || "";

        let ok = await copyTextSafe(text);

        if(ok){
            showCopyToast("Copied: " + text);
        }else{
            showCopyToast("Copy failed");
        }
    };

    document.addEventListener("click", async function(e){
        let el = e.target.closest(".addr");

        if(!el){
            return;
        }

        let text = el.getAttribute("data-copy") || el.innerText || "";
        let ok = await copyTextSafe(text);

        if(ok){
            showCopyToast("Copied: " + text);
        }else{
            showCopyToast("Copy failed");
        }
    });
})();
</script>


<style>
/* VPN Portal UPTIME COLUMN */
.uptime-badge{

<script>

(function(){
    window.applyUptimeColumn = function(vpnName, data){
        if(typeof safeId !== "function") return;

        let id = safeId(vpnName);
        let uptimeEl = document.getElementById("uptime_" + id);

        if(!uptimeEl) return;

        let txt = data.uptimeText || data.uptime || "";

        if(!data.ok){
            txt = "ERROR";
        }else if(!data.online){
            txt = "OFFLINE";
        }else if(!txt){
            txt = "ONLINE";
        }

        uptimeEl.innerText = txt;

        if(txt === "OFFLINE" || txt === "ERROR"){
            uptimeEl.className = "uptime-badge uptime-offline";
        }else{
            uptimeEl.className = "uptime-badge";
        }
    };

    const oldLoadRow = window.loadRow;

    if(typeof oldLoadRow === "function" && !window.loadRowUptimeWrapped){
        window.loadRowUptimeWrapped = true;

        window.loadRow = async function(vpnName){
            await oldLoadRow(vpnName);

            try{
                let res = await fetch("api/vpn_status_one.php", {
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    cache:"no-store",
                    body:JSON.stringify({vpnName:vpnName})
                });

                let data = await res.json();

                if(typeof applyUptimeColumn === "function"){
                    applyUptimeColumn(vpnName, data);
                }
            }catch(e){
                if(typeof safeId === "function"){
                    let el = document.getElementById("uptime_" + safeId(vpnName));
                    if(el){

<script>
/* VPN Portal ONLINE OFFLINE FILTER */
(function(){
    function ensureStatusFilter(){
        let tools = document.querySelector(".tools");

        if(!tools){
            return;
        }

        if(document.getElementById("statusFilter")){
            return;
        }

        let select = document.createElement("select");
        select.id = "statusFilter";
        select.innerHTML = `
            <option value="all">All</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
        `;

        select.onchange = function(){
            applyClientStatusFilter();
        };

        tools.appendChild(select);
    }

    window.applyClientStatusFilter = function(){
        let filter = document.getElementById("statusFilter");

        if(!filter){
            return;
        }

        let value = filter.value;
        let rows = document.querySelectorAll("#vpnTable tr");

        rows.forEach(row => {
            let onlineCell = row.querySelector("[id^='online_']");

            if(!onlineCell){
                row.style.display = "";
                return;
            }

            let status = (onlineCell.innerText || "").trim().toLowerCase();

            if(value === "all"){
                row.style.display = "";
                return;
            }

            if(value === "online"){
                row.style.display = status === "online" ? "" : "none";
                return;
            }

            if(value === "offline"){
                row.style.display = (status === "offline" || status === "error") ? "" : "none";
                return;
            }
        });
    };

    const oldRender = window.render;

    if(typeof oldRender === "function" && !window.renderStatusFilterWrapped){
        window.renderStatusFilterWrapped = true;

        window.render = function(){
            oldRender();

            setTimeout(function(){
                ensureStatusFilter();
                applyClientStatusFilter();
            }, 200);
        };
    }

    const oldLoadRow = window.loadRow;

    if(typeof oldLoadRow === "function" && !window.loadRowStatusFilterWrapped){
        window.loadRowStatusFilterWrapped = true;

        window.loadRow = async function(vpnName){
            await oldLoadRow(vpnName);

            setTimeout(function(){
                applyClientStatusFilter();
            }, 100);
        };
    }

    document.addEventListener("DOMContentLoaded", function(){
        setTimeout(function(){
            ensureStatusFilter();
            applyClientStatusFilter();
        }, 500);

        setTimeout(function(){
            ensureStatusFilter();
            applyClientStatusFilter();
        }, 1500);
    });
})();
</script>

            <input id="nickOriginalVpn" type="text" readonly>
        </div>

        <div class="nickname-field">
            <label>Nickname</label>
            <input id="nickInput" type="text" placeholder="ex: Office VPN">
        </div>

        <div class="nickname-actions">
            <button class="nick-close" type="button" onclick="closeNicknameModal()">Close</button>
            <button class="nick-close" type="button" onclick="clearNicknameModal()">Clear</button>
            <button class="nick-save" type="button" onclick="saveNicknameModal()">Save</button>
        </div>
    </div>
</div>

<script>
/* CLIENT VPN NICKNAME EDIT */
(function(){
    window.nicknameCache = window.nicknameCache || {};
    window.currentNicknameVpn = "";

    function decodeVpnSafe(value){
        value = String(value || "");

        if(typeof safeDecodeVpn === "function"){
            return safeDecodeVpn(value);
        }

        try{
            return decodeURIComponent(value);
        }catch(e){
            return value;
        }
    }

    async function fetchNickname(vpnName){
        try{
            let res = await fetch("api/nickname_one.php?vpnName=" + encodeURIComponent(vpnName) + "&ts=" + Date.now(), {
                cache:"no-store"
            });

            let data = await res.json();

            if(data.ok){
                window.nicknameCache[vpnName] = data.nickname || "";
                return data.nickname || "";
            }
        }catch(e){}

        return window.nicknameCache[vpnName] || "";
    }

    window.applyNickname = async function(vpnName){
        if(typeof safeId !== "function"){
            return;
        }

        let id = safeId(vpnName);
        let nameEl = document.getElementById("nick_" + id);
        let realEl = document.getElementById("real_" + id);

        if(!nameEl){
            return;
        }

        let nick = await fetchNickname(vpnName);

        nameEl.innerText = nick || vpnName;

        if(realEl){
            realEl.innerText = nick ? ("VPN: " + vpnName) : "";
        }
    };

    window.applyAllNicknames = function(){
        document.querySelectorAll(".vpn-name[data-vpn]").forEach(el => {
            let vpnName = el.getAttribute("data-vpn") || el.innerText || "";
            if(vpnName){
                applyNickname(vpnName);
            }
        });
    };

    window.openNicknameModal = async function(encoded){
        let vpnName = decodeVpnSafe(encoded);

        window.currentNicknameVpn = vpnName;

        document.getElementById("nickOriginalVpn").value = vpnName;
        document.getElementById("nickInput").value = window.nicknameCache[vpnName] || await fetchNickname(vpnName);

        document.getElementById("nicknameModal").style.display = "flex";

        setTimeout(function(){
            document.getElementById("nickInput").focus();
        }, 100);
    };

    window.closeNicknameModal = function(){
        document.getElementById("nicknameModal").style.display = "none";
    };

    window.clearNicknameModal = async function(){
        document.getElementById("nickInput").value = "";
        await saveNicknameModal();
    };

    window.saveNicknameModal = async function(){
        let vpnName = window.currentNicknameVpn;
        let nickname = document.getElementById("nickInput").value.trim();

        if(!vpnName){
            alert("No VPN selected");
            return;
        }

        try{
            let res = await fetch("api/nickname_one.php", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                cache:"no-store",
                body:JSON.stringify({
                    vpnName:vpnName,
                    nickname:nickname
                })
            });

            let data = await res.json();

            if(!data.ok){
                alert(data.error || "Save failed");
                return;
            }

            window.nicknameCache[vpnName] = data.nickname || "";

            await applyNickname(vpnName);
            closeNicknameModal();

        }catch(e){
            alert("Save nickname error: " + e.message);
        }
    };

    const oldRender = window.render;

    if(typeof oldRender === "function" && !window.nicknameRenderWrapped){
        window.nicknameRenderWrapped = true;

        window.render = function(){
            oldRender();
            setTimeout(applyAllNicknames, 300);
            setTimeout(applyAllNicknames, 1000);
        };
    }

    const oldLoadRow = window.loadRow;

    if(typeof oldLoadRow === "function" && !window.nicknameLoadRowWrapped){
        window.nicknameLoadRowWrapped = true;

        window.loadRow = async function(vpnName){
            await oldLoadRow(vpnName);
            setTimeout(function(){
                applyNickname(vpnName);
            }, 100);
        };
    }

    document.addEventListener("keydown", function(e){
        if(e.key === "Escape"){
            let modal = document.getElementById("nicknameModal");
            if(modal && modal.style.display === "flex"){
                closeNicknameModal();
            }
        }
    });

    document.addEventListener("click", function(e){
        let modal = document.getElementById("nicknameModal");
        if(modal && modal.style.display === "flex" && e.target === modal){
            closeNicknameModal();
        }
    });

    document.addEventListener("DOMContentLoaded", function(){
        setTimeout(applyAllNicknames, 600);
        setTimeout(applyAllNicknames, 1500);
    });
})();
</script>


<script>
/* CLIENT SEARCH BY NICKNAME */
(function(){
    window.nicknameCache = window.nicknameCache || {};

    async function loadNicknameForSearch(vpnName){
        if(window.nicknameCache[vpnName] !== undefined){
            return window.nicknameCache[vpnName] || "";
        }

        try{
            let res = await fetch("api/nickname_one.php?vpnName=" + encodeURIComponent(vpnName) + "&ts=" + Date.now(), {
                cache:"no-store"
            });

            let data = await res.json();

            if(data.ok){
                window.nicknameCache[vpnName] = data.nickname || "";
                return window.nicknameCache[vpnName];
            }
        }catch(e){}

        window.nicknameCache[vpnName] = "";
        return "";
    }

    window.preloadNicknamesForSearch = async function(){
        if(!Array.isArray(myVpns)){
            return;
        }

        await Promise.all(myVpns.map(vpn => loadNicknameForSearch(vpn)));
    };

    window.applyClientStatusFilter = function(){
        let search = document.getElementById("searchBox");
        let filter = document.getElementById("statusFilter");

        let q = search ? search.value.trim().toLowerCase() : "";
        let statusValue = filter ? filter.value : "all";

        let rows = document.querySelectorAll("#vpnTable tr");

        rows.forEach(row => {
            let onlineCell = row.querySelector("[id^='online_']");

            if(!onlineCell){
                row.style.display = "";
                return;
            }

            let vpnName = row.getAttribute("data-vpn") || "";
            let nickname = window.nicknameCache[vpnName] || "";

            let textMatch =
                !q ||
                vpnName.toLowerCase().includes(q) ||
                nickname.toLowerCase().includes(q) ||
                row.innerText.toLowerCase().includes(q);

            let status = (onlineCell.innerText || "").trim().toLowerCase();

            let statusMatch = true;

            if(statusValue === "online"){
                statusMatch = status === "online";
            }

            if(statusValue === "offline"){
                statusMatch = status === "offline" || status === "error";
            }

            row.style.display = (textMatch && statusMatch) ? "" : "none";
        });
    };

    window.render = function(){
        let tbody = document.getElementById("vpnTable");

        if(!tbody){
            return;
        }

        let list = Array.isArray(myVpns) ? myVpns : [];

        if(list.length === 0){
            tbody.innerHTML = `<tr><td colspan="7">No VPN found.</td></tr>`;
            let totalVpn = document.getElementById("totalVpn");
            let totalOnline = document.getElementById("totalOnline");
            let totalOffline = document.getElementById("totalOffline");

            if(totalVpn) totalVpn.innerText = "0";
            if(totalOnline) totalOnline.innerText = "0";
            if(totalOffline) totalOffline.innerText = "0";
            return;
        }

        tbody.innerHTML = list.map(vpn => {
            let id = safeId(vpn);
            return `
                <tr data-vpn="${vpn}">
                    <td>
                        <div class="vpn-name-wrap">
                            <div class="vpn-name-line">
                                <span class="vpn-name" id="nick_${id}" data-vpn="${vpn}">${vpn}</span>
                                <button class="nick-edit-btn" type="button" onclick="openNicknameModal('${encodeURIComponent(vpn)}')">Edit</button>
                            </div>
                            <div class="vpn-real-name" id="real_${id}"></div>
                        </div>
                    </td>
                    <td><span class="addr" title="Click to copy" id="addr_${id}" onclick="copyAddress('${id}')">Loading...</span></td>
                    <td><button class="btn" id="script_${id}" onclick="openScript('${encodeURIComponent(vpn)}')">Script</button></td>
                    <td><span class="badge checking" id="online_${id}">CHECKING</span></td>
                    <td><span class="uptime-badge uptime-offline" id="uptime_${id}">CHECKING</span></td>
                    <td><span class="day-badge checking" id="day_${id}">CHECKING</span></td>
                    <td>
                        <label class="toggle">
                            <input type="checkbox" id="toggle_${id}" onchange="toggleVpn('${encodeURIComponent(vpn)}', this)">
                            <span class="slider"></span>
                        </label>
                    </td>
                </tr>
            `;
        }).join("");

        let totalVpn = document.getElementById("totalVpn");
        if(totalVpn) totalVpn.innerText = myVpns.length;

        list.forEach(vpn => {
            if(typeof loadRow === "function"){
                loadRow(vpn);
            }
        });

        setTimeout(async function(){
            await preloadNicknamesForSearch();

            if(typeof applyAllNicknames === "function"){
                applyAllNicknames();
            }

            applyClientStatusFilter();
        }, 250);
    };

    document.addEventListener("DOMContentLoaded", function(){
        let search = document.getElementById("searchBox");

        if(search){
            search.oninput = function(){
                applyClientStatusFilter();
            };
        }

        setTimeout(async function(){
            await preloadNicknamesForSearch();
            applyClientStatusFilter();
        }, 1000);

        setTimeout(async function(){
            await preloadNicknamesForSearch();
            applyClientStatusFilter();
        }, 2500);
    });
})();
</script>

<script>
/* CLIENT CHANGE PASSWORD */
(function(){
    function ensureChangePassButton(){
        let header = document.querySelector(".header");

        if(!header || document.getElementById("changePassBtn")){
            return;
        }

        let logoutBtn = header.querySelector(".logout");

        let btn = document.createElement("button");
        btn.id = "changePassBtn";
        btn.className = "change-pass-btn";
        btn.type = "button";
        btn.innerText = "Change Pass";
        btn.onclick = openChangePassModal;

        if(logoutBtn){
            logoutBtn.insertAdjacentElement("beforebegin", btn);
        }else{
            header.appendChild(btn);
        }
    }

    window.openChangePassModal = function(){
        document.getElementById("oldClientPass").value = "";
        document.getElementById("newClientPass").value = "";
        document.getElementById("confirmClientPass").value = "";
        document.getElementById("changePassModal").style.display = "flex";

        setTimeout(function(){
            document.getElementById("oldClientPass").focus();
        }, 100);
    };

    window.closeChangePassModal = function(){
        document.getElementById("changePassModal").style.display = "none";
    };

    window.saveClientPassword = async function(){
        let username = localStorage.getItem("vpnLoginUser") || "";
        let oldPass = document.getElementById("oldClientPass").value.trim();
        let newPass = document.getElementById("newClientPass").value.trim();
        let confirmPass = document.getElementById("confirmClientPass").value.trim();

        if(!username){
            alert("Login user not found");
            return;
        }

        if(!oldPass || !newPass || !confirmPass){
            alert("Please complete all fields");
            return;
        }

        if(newPass.length < 4){
            alert("New password must be at least 4 characters");
            return;
        }

        if(newPass !== confirmPass){
            alert("New password and confirm password do not match");
            return;
        }

        try{
            let res = await fetch("api/change_client_password.php", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                cache:"no-store",
                body:JSON.stringify({
                    username:username,
                    oldPassword:oldPass,
                    newPassword:newPass
                })
            });

            let data = await res.json();

<script>
/* CLIENT MOBILE SEARCH REAL FIX */
(function(){
    function getRowVpnName(row){
        return row.getAttribute("data-vpn") || "";
    }

    window.applyClientStatusFilter = function(){
        let search = document.getElementById("searchBox");
        let filter = document.getElementById("statusFilter");
        let tbody = document.getElementById("vpnTable");

        if(!tbody){
            return;
        }

        let q = search ? search.value.trim().toLowerCase() : "";
        let statusValue = filter ? filter.value : "all";

        let oldNoResult = document.getElementById("clientNoSearchResult");
        if(oldNoResult){
            oldNoResult.remove();
        }

        let rows = Array.from(tbody.querySelectorAll("tr")).filter(row => row.id !== "clientNoSearchResult");
        let visible = 0;

        rows.forEach(row => {
            let onlineCell = row.querySelector("[id^='online_']");

            if(!onlineCell){
                row.classList.remove("client-filter-hidden");
                return;
            }

            let vpnName = getRowVpnName(row);
            let nickname = "";

            if(window.nicknameCache && vpnName){
                nickname = window.nicknameCache[vpnName] || "";
            }

            let rowText = (row.innerText || "").toLowerCase();

            let matchSearch =
                !q ||
                rowText.includes(q) ||
                vpnName.toLowerCase().includes(q) ||
                nickname.toLowerCase().includes(q);

            let status = (onlineCell.innerText || "").trim().toLowerCase();

            let matchStatus = true;

            if(statusValue === "online"){
                matchStatus = status === "online";
            }

            if(statusValue === "offline"){
                matchStatus = status === "offline" || status === "error";
            }

            if(matchSearch && matchStatus){
                row.classList.remove("client-filter-hidden");
                visible++;
            }else{
                row.classList.add("client-filter-hidden");
            }
        });

        if((q || statusValue !== "all") && visible === 0){
            let tr = document.createElement("tr");
            tr.id = "clientNoSearchResult";
            tr.innerHTML = `<td colspan="7">No result found</td>`;
            tbody.appendChild(tr);
        }
    };

    function bindClientSearchMobile(){
        let search = document.getElementById("searchBox");
        let filter = document.getElementById("statusFilter");
        let reset = document.getElementById("clientFilterReset");

        if(search && !search.dataset.mobileSearchFixed){
            search.dataset.mobileSearchFixed = "yes";
            search.addEventListener("input", function(){
                applyClientStatusFilter();
            });
        }

        if(filter && !filter.dataset.mobileFilterFixed){
            filter.dataset.mobileFilterFixed = "yes";
            filter.addEventListener("change", function(){
                applyClientStatusFilter();
            });
        }

        if(reset && !reset.dataset.mobileResetFixed){
            reset.dataset.mobileResetFixed = "yes";
            reset.addEventListener("click", function(){
                if(search) search.value = "";
                if(filter) filter.value = "all";
                applyClientStatusFilter();
            });
        }
    }

    const oldRender = window.render;

    if(typeof oldRender === "function" && !window.clientMobileSearchRenderWrapped){
        window.clientMobileSearchRenderWrapped = true;

        window.render = function(){
            oldRender();

            setTimeout(function(){
                bindClientSearchMobile();

                if(typeof preloadNicknamesForSearch === "function"){
                    preloadNicknamesForSearch().then(function(){
                        applyClientStatusFilter();
                    });
                }else{
                    applyClientStatusFilter();
                }
            }, 250);
        };
    }

    const oldLoadRow = window.loadRow;

    if(typeof oldLoadRow === "function" && !window.clientMobileSearchLoadRowWrapped){
        window.clientMobileSearchLoadRowWrapped = true;

        window.loadRow = async function(vpnName){
            await oldLoadRow(vpnName);

            setTimeout(function(){
                bindClientSearchMobile();
                applyClientStatusFilter();
            }, 150);
        };
    }

    document.addEventListener("DOMContentLoaded", function(){
        setTimeout(function(){
            bindClientSearchMobile();
            applyClientStatusFilter();
        }, 500);

        setTimeout(function(){
            bindClientSearchMobile();
            applyClientStatusFilter();
        }, 1500);

        setTimeout(function(){
            bindClientSearchMobile();
            applyClientStatusFilter();
        }, 3000);
    });
})();
</script>

<script>

(function(){

<script>
/* VPN PORTAL PAGINATION FINAL */
(function(){
    let currentPage = 1;
    let applying = false;
    let pageSize = parseInt(localStorage.getItem("vpnPortalPageSize") || "10", 10);

    if(![10,50,100].includes(pageSize)){
        pageSize = 10;
    }

    function getTools(){
        return document.querySelector(".tools");
    }

    function findVpnTable(){
        let tables = Array.from(document.querySelectorAll("table"));

        return tables.find(function(tbl){
            let txt = (tbl.textContent || "").toUpperCase();
            return txt.includes("WINBOX") ||
                   txt.includes("VPN") ||
                   txt.includes("UPTIME") ||
                   txt.includes("DAY LEFT") ||
                   txt.includes("ENABLE");
        }) || tables[0] || null;
    }

    function getVpnRows(){
        let table = findVpnTable();

        if(table){
            let rows = Array.from(table.querySelectorAll("tbody tr"));

            if(!rows.length){
                rows = Array.from(table.querySelectorAll("tr")).filter(function(row){
                    return !row.querySelector("th");
                });
            }

            return rows.filter(function(row){
                let txt = (row.textContent || "").trim();
                return txt && !txt.toUpperCase().includes("WINBOX NAME");
            });
        }

        return Array.from(document.querySelectorAll(".vpn-card, .client-card, .mobile-card, .card")).filter(function(card){
            let txt = (card.textContent || "").trim().toUpperCase();
            return txt && (
                txt.includes("ONLINE") ||
                txt.includes("OFFLINE") ||
                txt.includes("EXPIRED") ||
                txt.includes("UPTIME") ||
                txt.includes("DAY LEFT") ||
                txt.includes("WINBOX")
            );
        });
    }

    function isVisibleByFilter(row){
        row.classList.remove("vpn-page-hidden");
        return window.getComputedStyle(row).display !== "none";
    }

    function getFilteredRows(){
        return getVpnRows().filter(isVisibleByFilter);
    }

    function ensurePaginationBar(){
        if(document.getElementById("vpnPortalPaginationBar")){
            return;
        }

        let bar = document.createElement("div");
        bar.id = "vpnPortalPaginationBar";
        bar.className = "vpn-pagination-bar";

        bar.innerHTML = `
            <div class="vpn-pagination-left">
                <label for="vpnPageSize">Show</label>
                <select id="vpnPageSize">
                    <option value="10">10</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <div class="vpn-pagination-right">
                <button type="button" class="vpn-page-btn" id="vpnPrevPage">Prev</button>
                <span id="vpnPageInfo">Page 1 of 1</span>
                <button type="button" class="vpn-page-btn" id="vpnNextPage">Next</button>
            </div>
        `;

        let tools = getTools();
        let table = findVpnTable();

        if(tools && tools.parentNode){
            tools.insertAdjacentElement("afterend", bar);
        }else if(table && table.parentNode){
            table.parentNode.insertBefore(bar, table);
        }else{
            document.body.appendChild(bar);
        }

        let sizeSelect = document.getElementById("vpnPageSize");
        sizeSelect.value = String(pageSize);

        sizeSelect.onchange = function(){
            pageSize = parseInt(this.value, 10);
            localStorage.setItem("vpnPortalPageSize", String(pageSize));
            currentPage = 1;
            applyVpnPagination();
        };

        document.getElementById("vpnPrevPage").onclick = function(){
            if(currentPage > 1){
                currentPage--;
                applyVpnPagination();
            }
        };

        document.getElementById("vpnNextPage").onclick = function(){
            let total = getFilteredRows().length;
            let pages = Math.max(1, Math.ceil(total / pageSize));

            if(currentPage < pages){
                currentPage++;
                applyVpnPagination();
            }
        };
    }

    window.applyVpnPortalPagination = function(){
        applyVpnPagination();
    };

    function applyVpnPagination(){
        if(applying) return;
        applying = true;

        ensurePaginationBar();

        let allRows = getVpnRows();

        allRows.forEach(function(row){
            row.classList.remove("vpn-page-hidden");
        });

        let visibleRows = getFilteredRows();
        let total = visibleRows.length;
        let pages = Math.max(1, Math.ceil(total / pageSize));

        if(currentPage > pages) currentPage = pages;
        if(currentPage < 1) currentPage = 1;

        let start = (currentPage - 1) * pageSize;
        let end = start + pageSize;

        visibleRows.forEach(function(row, index){
            if(index < start || index >= end){
                row.classList.add("vpn-page-hidden");
            }
        });

        let info = document.getElementById("vpnPageInfo");
        let prev = document.getElementById("vpnPrevPage");
        let next = document.getElementById("vpnNextPage");

        if(info){
            info.textContent = "Page " + currentPage + " of " + pages + " • " + total + " VPN";
        }

        if(prev){
            prev.disabled = currentPage <= 1;
        }

        if(next){
            next.disabled = currentPage >= pages;
        }

        applying = false;
    }

    function resetAndApply(){
        currentPage = 1;
        setTimeout(applyVpnPagination, 80);
        setTimeout(applyVpnPagination, 400);
        setTimeout(applyVpnPagination, 1000);
    }

    function hookControls(){
        let search = document.getElementById("searchBox");
        let reset = document.getElementById("clientFilterReset");
        let filter = document.getElementById("statusFilter");
        let refresh = document.getElementById("clientToolbarRefresh");

        if(search && !search.dataset.vpnPaginationHooked){
            search.dataset.vpnPaginationHooked = "1";
            search.addEventListener("input", resetAndApply);
        }

        if(filter && !filter.dataset.vpnPaginationHooked){
            filter.dataset.vpnPaginationHooked = "1";
            filter.addEventListener("change", resetAndApply);
        }

        if(reset && !reset.dataset.vpnPaginationHooked){
            reset.dataset.vpnPaginationHooked = "1";
            reset.addEventListener("click", resetAndApply);
        }

        if(refresh && !refresh.dataset.vpnPaginationHooked){
            refresh.dataset.vpnPaginationHooked = "1";
            refresh.addEventListener("click", function(){
                setTimeout(applyVpnPagination, 500);
                setTimeout(applyVpnPagination, 1500);
            });
        }
    }

    function wrapExistingFunctions(){
        if(typeof window.render === "function" && !window.__vpnPaginationRenderWrapped){
            window.__vpnPaginationRenderWrapped = true;
            const oldRender = window.render;

            window.render = function(){
                let result = oldRender.apply(this, arguments);
                resetAndApply();
                return result;
            };
        }

        if(typeof window.applyClientStatusFilter === "function" && !window.__vpnPaginationFilterWrapped){
            window.__vpnPaginationFilterWrapped = true;
            const oldFilter = window.applyClientStatusFilter;

            window.applyClientStatusFilter = function(){
                let result = oldFilter.apply(this, arguments);
                resetAndApply();
                return result;
            };
        }
    }

    function init(){
        ensurePaginationBar();
        hookControls();
        wrapExistingFunctions();
        applyVpnPagination();
    }

    document.addEventListener("DOMContentLoaded", function(){
        init();
        setTimeout(init, 500);
        setTimeout(init, 1500);
        setTimeout(init, 3000);
    });

    window.addEventListener("pageshow", function(){
        setTimeout(init, 300);
    });

    let timer = null;
    const obs = new MutationObserver(function(){
        clearTimeout(timer);
        timer = setTimeout(function(){
            hookControls();
            applyVpnPagination();
        }, 250);
    });

    obs.observe(document.body, {
        childList:true,
        subtree:true
    });
})();
</script>

<script>

<script>
/* CLIENT VPN ADDRESS MODAL FINAL */
(function(){
    if(window.__safeVpnAddressModalInstalled) return;
    window.__safeVpnAddressModalInstalled = true;

    let currentWinboxAddress = "";
    let currentSshAddress = "";

    function cleanText(s){
        return (s || "").toString().trim().replace(/\s+/g, " ");
    }

    function findAddress(text){
        text = cleanText(text);

        const match = text.match(/([a-z0-9.-]+\.[a-z]{2,}):([0-9]{1,5})/i);
        if(!match) return null;

        const domain = match[1];
        const portRaw = match[2];
        const portNum = parseInt(portRaw, 10);

        if(!domain || !portNum || portNum < 1 || portNum > 65535) return null;

        const sshNum = Math.min(portNum + 1, 65535);
        const sshRaw = String(sshNum).padStart(portRaw.length, "0");

        return {
            domain: domain,
            winboxPort: portRaw,
            sshPort: sshRaw,
            winboxAddress: domain + ":" + portRaw,
            sshAddress: domain + ":" + sshRaw
        };
    }

    function isCleanAddressText(text, info){
        text = cleanText(text);
        if(!info) return false;

        // exact address lang dapat, para hindi mahuli buong row/card/modal
        if(text === info.winboxAddress) return true;

        // allow very small wrappers only
        if(text.includes(info.winboxAddress) && text.length <= info.winboxAddress.length + 8){
            return true;
        }

        return false;
    }

    function getClientName(){
        const els = Array.from(document.querySelectorAll("h1,h2,h3,div,span,p"));

        for(const el of els){
            const txt = cleanText(el.textContent);
            const m = txt.match(/Hi,\s*([A-Za-z0-9._ -]+)/i);
            if(m && m[1]) return m[1].trim();
        }

        return "";
    }

    function ensureModal(){
        if(document.getElementById("vpnAddressModal")) return;

        const modal = document.createElement("div");
        modal.id = "vpnAddressModal";
        modal.innerHTML = `
            <div class="vpn-address-modal-box">
                <h3>VPN Address</h3>

                <div class="vpn-address-list">
                    <div class="vpn-address-item">
                        <div class="vpn-address-label">WINBOX</div>
                        <div class="vpn-address-value" id="modalWinboxAddress">-</div>
                        <div class="vpn-address-port" id="modalWinboxLocalPort">local port: loading...</div>
                    </div>

                    <div class="vpn-address-item">
                        <div class="vpn-address-label">SSH</div>
                        <div class="vpn-address-value" id="modalSshAddress">-</div>
                        <div class="vpn-address-port" id="modalSshLocalPort">local port: loading...</div>
                    </div>
                </div>

                <div class="vpn-address-actions">
                    <button id="copyWinboxAddrBtn" type="button">Copy Winbox</button>
                    <button id="copySshAddrBtn" type="button">Copy SSH</button>
                    <button id="closeVpnAddressModalBtn" type="button">Close</button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);

        document.getElementById("closeVpnAddressModalBtn").onclick = function(){
            modal.classList.remove("show");
        };

        modal.addEventListener("click", function(e){
            if(e.target === modal){
                modal.classList.remove("show");
            }
        });

        document.getElementById("copyWinboxAddrBtn").onclick = function(){
            copyText(currentWinboxAddress);
        };

        document.getElementById("copySshAddrBtn").onclick = function(){
            copyText(currentSshAddress);
        };
    }

    async function copyText(text){
        if(!text) return;

        try{
            await navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        }catch(e){
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
            alert("Copied: " + text);
        }
    }

    async function loadLocalPorts(info){
        try{
            const client = getClientName();

            const res = await fetch(
                "/api/local_ports.php?port=" + encodeURIComponent(info.winboxPort) +
                "&client=" + encodeURIComponent(client) +
                "&v=" + Date.now()
            );

            const data = await res.json();

            document.getElementById("modalWinboxLocalPort").textContent =
                "local port: " + (data.winboxLocalPort || "8291");

            document.getElementById("modalSshLocalPort").textContent =
                "local port: " + (data.sshLocalPort || "22");

        }catch(e){
            document.getElementById("modalWinboxLocalPort").textContent = "local port: 8291";
            document.getElementById("modalSshLocalPort").textContent = "local port: 22";
        }
    }

    function openAddressModal(info){
        ensureModal();

        currentWinboxAddress = info.winboxAddress;
        currentSshAddress = info.sshAddress;

        document.getElementById("modalWinboxAddress").textContent = info.winboxAddress;
        document.getElementById("modalSshAddress").textContent = info.sshAddress;

        document.getElementById("modalWinboxLocalPort").textContent = "local port: loading...";
        document.getElementById("modalSshLocalPort").textContent = "local port: loading...";

        document.getElementById("vpnAddressModal").classList.add("show");

        loadLocalPorts(info);
    }

    function isInsideOtherModalOrInput(target){
        if(!target) return true;

        if(target.closest("#vpnAddressModal")) return true;

        // huwag mag-trigger kapag nasa ibang modal
        if(target.closest("#clientFundModal, #adminFundModal, #brandingModal, #changePasswordModal, #nicknameModal")) return true;
        if(target.closest(".modal, [role='dialog']")) return true;

        // huwag mag-trigger sa form/buttons/action buttons
        if(target.closest("input, select, textarea")) return true;

        const btn = target.closest("button");
        if(btn){
            const txt = cleanText(btn.textContent);
            const info = findAddress(txt);
            if(!info || !isCleanAddressText(txt, info)){
                return true;
            }
        }

        return false;
    }

    function findClickedAddressTarget(e){
        if(isInsideOtherModalOrInput(e.target)) return null;

        let el = e.target;

        for(let i = 0; i < 5 && el; i++, el = el.parentElement){
            if(!el || el === document.body || el === document.documentElement) break;

            const tag = (el.tagName || "").toUpperCase();

            // stop sa malalaking container para hindi mahuli buong row/table/page
            if(["TR","TABLE","TBODY","THEAD","FORM","SECTION","MAIN","HEADER"].includes(tag)){
                break;
            }

            const txt = cleanText(el.textContent);
            const info = findAddress(txt);

            if(info && isCleanAddressText(txt, info)){
                return {el: el, info: info};
            }
        }

        return null;
    }

    function markAddressElements(){
        document.querySelectorAll("td, span, a, button, small, div").forEach(function(el){
            if(el.closest("#vpnAddressModal")) return;
            if(el.closest(".modal, [role='dialog']")) return;

            const txt = cleanText(el.textContent);
            const info = findAddress(txt);

            if(info && isCleanAddressText(txt, info)){
                el.classList.add("vpn-address-clickable-safe");
                el.title = "Click to view Winbox / SSH address";
            }
        });
    }

    document.addEventListener("click", function(e){
        const found = findClickedAddressTarget(e);
        if(!found) return;

        e.preventDefault();
        e.stopPropagation();

        openAddressModal(found.info);
    }, false);

    document.addEventListener("DOMContentLoaded", function(){
        ensureModal();
        markAddressElements();
        setTimeout(markAddressElements, 500);
        setTimeout(markAddressElements, 1500);
    });

    window.addEventListener("pageshow", function(){
        setTimeout(markAddressElements, 300);
    });

    let timer = null;
    const obs = new MutationObserver(function(){
        clearTimeout(timer);
        timer = setTimeout(markAddressElements, 350);
    });

    obs.observe(document.body, {
        childList:true,
        subtree:true
    });
})();
</script>

<script>
/* CLIENT CUSTOM LOCAL PORT TO CHR NO PASSWORD FINAL */
(function(){
    if(window.__clientCustomLocalPortNoPasswordFinal) return;
    window.__clientCustomLocalPortNoPasswordFinal = true;

    let lastVpnInfo = null;

    function cleanText(s){
        return (s || "").toString().trim().replace(/\s+/g, " ");
    }

    function findAddress(text){
        const m = cleanText(text).match(/([a-z0-9.-]+\.[a-z]{2,}):([0-9]{1,5})/i);
        if(!m) return null;

        const domain = m[1];
        const winboxPort = m[2];
        const sshPort = String(parseInt(winboxPort, 10) + 1).padStart(winboxPort.length, "0");

        return {domain, winboxPort, sshPort};
    }

    function getClientName(){
        const els = Array.from(document.querySelectorAll("h1,h2,h3,div,span,p"));

        for(const el of els){
            const txt = cleanText(el.textContent);
            const m = txt.match(/Hi,\s*([A-Za-z0-9._ -]+)/i);
            if(m && m[1]) return m[1].trim();
        }

        return "";
    }

    function localPortNumberFromText(id, fallback){
        const el = document.getElementById(id);
        const txt = el ? cleanText(el.textContent) : "";
        const m = txt.match(/([0-9]{1,5})/);
        return m ? m[1] : fallback;
    }

    function ensureEditBox(){
        const modalBox = document.querySelector("#vpnAddressModal .vpn-address-modal-box");
        if(!modalBox) return;

        let actions = modalBox.querySelector(".vpn-address-actions");

        if(actions && !document.getElementById("editLocalPortsBtn")){
            const btn = document.createElement("button");
            btn.type = "button";
            btn.id = "editLocalPortsBtn";
            btn.textContent = "Edit Ports";
            actions.insertBefore(btn, actions.firstChild);

            btn.onclick = function(){
                const box = document.getElementById("vpnLocalPortEditBox");
                if(!box) return;

                document.getElementById("editWinboxLocalPort").value =
                    localPortNumberFromText("modalWinboxLocalPort", "8291");

                document.getElementById("editSshLocalPort").value =
                    localPortNumberFromText("modalSshLocalPort", "22");

                box.classList.toggle("show");
            };
        }

        if(document.getElementById("vpnLocalPortEditBox")) return;

        const box = document.createElement("div");
        box.id = "vpnLocalPortEditBox";
        box.innerHTML = `
            <label>Winbox Local Port</label>
            <input id="editWinboxLocalPort" type="number" min="1" max="65535" placeholder="8291">

            <label>SSH Local Port</label>
            <input id="editSshLocalPort" type="number" min="1" max="65535" placeholder="22">

            <button id="saveLocalPortsBtn" type="button">Save to CHR</button>
        `;

        if(actions){
            actions.insertAdjacentElement("beforebegin", box);
        }else{
            modalBox.appendChild(box);
        }

        document.getElementById("saveLocalPortsBtn").onclick = saveLocalPortsToChr;
    }

    async function refreshModalLivePorts(){
        if(!lastVpnInfo) return;

        try{
            const client = getClientName();
            const url =
                "/api/local_ports.php?domain=" + encodeURIComponent(lastVpnInfo.domain) +
                "&winboxPort=" + encodeURIComponent(lastVpnInfo.winboxPort) +
                "&client=" + encodeURIComponent(client) +
                "&v=" + Date.now();

            const res = await fetch(url, {cache:"no-store"});
            const data = await res.json();

            if(data.ok){
                const w = document.getElementById("modalWinboxLocalPort");
                const s = document.getElementById("modalSshLocalPort");

                if(w) w.textContent = "local port: " + (data.winboxLocalPort || "8291");
                if(s) s.textContent = "local port: " + (data.sshLocalPort || "22");
            }
        }catch(e){}
    }

    async function saveLocalPortsToChr(){
        if(!lastVpnInfo){
            alert("No VPN address selected");
            return;
        }

        const client = getClientName();
        const winboxLocal = document.getElementById("editWinboxLocalPort").value.trim();
        const sshLocal = document.getElementById("editSshLocalPort").value.trim();

        if(!client){
            alert("Client name not detected");
            return;
        }

        if(!winboxLocal || !sshLocal){
            alert("Enter local ports");
            return;
        }

        const btn = document.getElementById("saveLocalPortsBtn");
        btn.disabled = true;
        btn.textContent = "Saving...";

        try{
            const res = await fetch("/api/update_local_port.php", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    client:client,
                    domain:lastVpnInfo.domain,
                    winboxPort:lastVpnInfo.winboxPort,
                    winboxLocalPort:winboxLocal,
                    sshLocalPort:sshLocal
                })
            });

            const data = await res.json();

            if(!data.ok){
                alert(data.message || "Failed to update local ports");
                btn.disabled = false;
                btn.textContent = "Save to CHR";
                return;
            }

            document.getElementById("modalWinboxLocalPort").textContent = "local port: " + data.winboxLocalPort;
            document.getElementById("modalSshLocalPort").textContent = "local port: " + data.sshLocalPort;

            const box = document.getElementById("vpnLocalPortEditBox");
            if(box) box.classList.remove("show");

            alert("Updated to CHR NAT");

            setTimeout(refreshModalLivePorts, 500);

        }catch(e){
            alert("Error: " + e.message);
        }

        btn.disabled = false;
        btn.textContent = "Save to CHR";
    }

    document.addEventListener("click", function(e){
        const info = findAddress(e.target.textContent || "");

        if(info){
            lastVpnInfo = info;

            setTimeout(function(){
                ensureEditBox();
                refreshModalLivePorts();
            }, 300);

            setTimeout(function(){
                ensureEditBox();
                refreshModalLivePorts();
            }, 900);
        }
    }, true);

    const obs = new MutationObserver(function(){
        if(document.getElementById("vpnAddressModal")){
            ensureEditBox();
        }
    });

    obs.observe(document.body, {
        childList:true,
        subtree:true
    });
})();
</script>

<script>

    // Stop old native prompt
    const oldPrompt = window.prompt;
    window.prompt = function(message, def){
        const msg = String(message || "").toLowerCase();
        if(msg.includes("portal password")){
            return "no-password-required";
        }
        return oldPrompt.call(window, message, def);
    };

    function cleanText(s){
        return (s || "").toString().trim().replace(/\s+/g, " ");
    }

    function removePasswordField(){
        document.querySelectorAll("#editLocalPortPassword").forEach(function(input){

            if(prev && cleanText(prev.textContent).toLowerCase().includes("portal password")){
                prev.remove();
            }
            input.remove();
        });

        document.querySelectorAll("label").forEach(function(label){
            if(cleanText(label.textContent).toLowerCase() === "portal password"){
                label.remove();
            }
        });

        const txt = cleanText(w ? w.textContent : "");

        const m = txt.match(/([a-z0-9.-]+\.[a-z]{2,}):([0-9]{1,5})/i);
        if(!m) return null;

        return {
            domain:m[1],

        const info = findModalAddress();

        if(!info){
            alert("No VPN address selected");
            return;

        const client = getClientName();
        const winboxLocal = (document.getElementById("editWinboxLocalPort")?.value || "").trim();
        const sshLocal = (document.getElementById("editSshLocalPort")?.value || "").trim();

        if(!client){

            return;

                method:"POST",

                    domain:info.domain,
                    winboxPort:info.winboxPort,
                    winboxLocalPort:winboxLocal,
                    sshLocalPort:sshLocal
                })
            });

            const data = await res.json();

                btn.textContent = "Save to CHR";

<script>
/* CLIENT DROPDOWN SAFE CLEAN FINAL */
(function(){
    if(window.__clientDropdownSafeCleanFinal) return;
    window.__clientDropdownSafeCleanFinal = true;

    function clean(s){
        return (s || "").toString().trim().replace(/\s+/g," ").toUpperCase();
    }

    function isDash(txt){
        return txt === "DASHBOARD" || txt === "DASHBOARD ▾" || txt === "DASHBOARD ▼";
    }

    function isMenuItem(txt){
        return (
            txt === "CHANGE PASS" ||
            txt === "CHANGE PASSWORD" ||
            txt === "LOGOUT" ||
            txt === "ADD FUND" ||
            txt === "PROFILE"
        );
    }

    function findMenu(btn){
        let p = btn.parentElement;

        for(let level=0; level<5 && p; level++, p=p.parentElement){
            const items = Array.from(p.querySelectorAll("button,a,.btn")).filter(function(x){
                return x !== btn && isMenuItem(clean(x.textContent));
            });

            if(items.length >= 1){
                return { parent:p, items:items };
            }
        }

        return null;
    }

    function showMenu(menu){
        if(!menu) return;

        menu.parent.classList.add("client-dd-menu-safe");
        menu.parent.style.display = "";
        menu.parent.style.visibility = "visible";
        menu.parent.style.opacity = "1";
        menu.parent.style.pointerEvents = "auto";
        menu.parent.style.zIndex = "99999";

        menu.items.forEach(function(item){
            const txt = clean(item.textContent);

            item.classList.add("client-dd-item-safe");
            item.style.pointerEvents = "auto";
            item.style.cursor = "pointer";

            if(txt.includes("LOGOUT")){
                item.classList.add("client-dd-danger-safe");
            }
        });
    }

    function apply(){
        document.querySelectorAll("button,a,.btn").forEach(function(btn){
            const txt = clean(btn.textContent);

            if(isDash(txt)){
                btn.classList.add("client-dd-btn-safe");
                btn.style.pointerEvents = "auto";
                btn.style.cursor = "pointer";

                if(btn.dataset.clientDropdownSafeAttached !== "1"){
                    btn.dataset.clientDropdownSafeAttached = "1";

                    btn.addEventListener("click", function(){
                        setTimeout(function(){
                            showMenu(findMenu(btn));
                        }, 30);

                        setTimeout(function(){
                            showMenu(findMenu(btn));
                        }, 150);
                    }, true);
                }
            }

            if(isMenuItem(txt)){
                btn.classList.add("client-dd-item-safe");

                if(txt.includes("LOGOUT")){
                    btn.classList.add("client-dd-danger-safe");
                }
            }
        });
    }

    document.addEventListener("DOMContentLoaded", function(){
        apply();
        setTimeout(apply, 500);
        setTimeout(apply, 1500);
    });

    document.addEventListener("click", function(){
        setTimeout(apply, 80);
    }, true);

    const obs = new MutationObserver(function(){
        setTimeout(apply, 100);
    });

    obs.observe(document.body, {
        childList:true,
        subtree:true,
        attributes:true
    });

    setInterval(apply, 2500);
})();
</script>

<script>
/* CLIENT PAID VPN GENERATOR FINAL */
(function(){
    if(window.__clientPaidVpnGeneratorFinal) return;
    window.__clientPaidVpnGeneratorFinal = true;

    function clean(s){
        return (s || "").toString().trim().replace(/\s+/g," ");
    }

    function detectClient(){
        const keys = ["clientName","client","vpnClient","portalClient","username","loginUser"];

        for(const k of keys){
            const v = clean(localStorage.getItem(k) || sessionStorage.getItem(k) || "");
            if(v) return v;
        }

        const body = clean(document.body.innerText || "");
        let m = body.match(/Hi,\s*([A-Za-z0-9._ -]+)/i);
        if(m && m[1]) return clean(m[1]);

        m = body.match(/Welcome,\s*([A-Za-z0-9._ -]+)/i);
        if(m && m[1]) return clean(m[1]);

        return "";
    }

    function addGenerateButton(){
        if(document.getElementById("clientGenerateVpnBtn")) return;

        const btn = document.createElement("button");
        btn.id = "clientGenerateVpnBtn";
        btn.type = "button";
        btn.className = "client-generate-vpn-btn-final";
        btn.textContent = "Generate VPN";

        const fundBar = document.getElementById("clientFundBar");
        const addFundBtn = document.getElementById("clientAddFundBtn");

        if(addFundBtn && addFundBtn.parentElement){
            addFundBtn.parentElement.insertBefore(btn, addFundBtn.nextSibling);
        }else if(fundBar){
            fundBar.appendChild(btn);
        }else{
            document.body.insertBefore(btn, document.body.firstChild);
        }

        btn.addEventListener("click", function(){
            document.getElementById("clientPaidGenModal").style.display = "flex";
        });
    }

    function updateFundText(balance){
        const peso = "₱" + Number(balance || 0).toFixed(2);

        document.querySelectorAll("*").forEach(function(el){
            if(el.children.length > 0) return;

            const txt = el.textContent || "";
            if(/Available Fund/i.test(txt) || /Fund/i.test(txt)){
                if(/₱[0-9,.]+/.test(txt)){
                    el.textContent = txt.replace(/₱[0-9,.]+/, peso);
                }
            }
        });
    }

    async function generatePaid(){
        const client = detectClient() || prompt("Client name?");
        if(!client) return alert("Client name not found.");

        const user = clean(document.getElementById("clientPaidGenUser").value);
        const password = clean(document.getElementById("clientPaidGenPass").value) || "21";
        const domain = document.getElementById("clientPaidGenDomain").value;
        const winboxPort = clean(document.getElementById("clientPaidGenPort").value);

        if(!user) return alert("Lagyan ng VPN Name.");

        if(!confirm("Generate & Push costs ₱300. Tuloy?")) return;

        const btn = document.getElementById("clientPaidGenSubmit");
        const out = document.getElementById("clientPaidGenOutput");

        btn.disabled = true;
        btn.textContent = "Generating...";
        out.value = "Generating and pushing to CHR...";

        try{
            const res = await fetch("/api/client_generate_vpn_paid.php?v=" + Date.now(), {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    client:client,
                    user:user,
                    password:password,
                    domain:domain,
                    winboxPort:winboxPort,
                    profile:"1mbps",
                    winboxLocalPort:"8291",
                    sshLocalPort:"22"
                })
            });

            const data = await res.json();

            if(!data.ok){
                out.value = data.message || "Generate failed.";
                if(data.generate){
                    out.value += "\n\n" + JSON.stringify(data.generate, null, 2);
                }
                alert(data.message || "Generate failed. Fund not deducted.");
                return;
            }

            const gen = data.generate || {};
            const script = gen.script || gen.clientScript || gen.vpnScript || "";

            out.value =
                (data.message || "Success") +
                "\nNew Balance: ₱" + Number(data.balance || 0).toFixed(2) +
                "\n\n" +
                (script || JSON.stringify(gen, null, 2));

            updateFundText(data.balance);

            alert("Success! ₱300 deducted. Balance: ₱" + Number(data.balance || 0).toFixed(2));

        }catch(e){
            out.value = "Error: " + e.message;
            alert("Error: " + e.message);
        }finally{
            btn.disabled = false;
            btn.textContent = "Generate & Push ₱300";
        }
    }

    document.addEventListener("DOMContentLoaded", function(){
        addGenerateButton();

        document.getElementById("clientPaidGenClose").addEventListener("click", function(){
            document.getElementById("clientPaidGenModal").style.display = "none";
        });

        document.getElementById("clientPaidGenSubmit").addEventListener("click", generatePaid);
    });

    setTimeout(addGenerateButton, 600);
    setTimeout(addGenerateButton, 1500);
})();
</script>

    display:none !important;

    margin-top:6px !important;

<script>
/* CLIENT PORTAL FAST MODE FINAL */
(function(){
    if(window.__clientPortalFastModeFinal) return;
    window.__clientPortalFastModeFinal = true;

    const ACTIVE_DOMAIN = "vpn.marvincloud2.link";

    function applyFastDefaults(){
        const pass = document.getElementById("clientPaidGenPass");
        const port = document.getElementById("clientPaidGenPort");
        const domain = document.getElementById("clientPaidGenDomain");
        const submit = document.getElementById("clientPaidGenSubmit");

        if(pass){
            pass.value = "21";
            const box = pass.closest(".client-paid-gen-field") || pass.parentElement;
            if(box) box.classList.add("client-fast-hide");
        }

        if(port){
            port.value = "random";
            const box = port.closest(".client-paid-gen-field") || port.parentElement;
            if(box) box.classList.add("client-fast-hide");
        }

        if(domain){
            Array.from(domain.options || []).forEach(function(opt){
                const val = (opt.value || "").toLowerCase();
                const txt = (opt.textContent || "").toLowerCase();

                if(val.includes("vpn.marvincloud1.link") || txt.includes("chr1")){
                    opt.disabled = true;
                    opt.textContent = "CHR1 - vpn.marvincloud1.link (Maintenance)";
                }

                if(val.includes("vpn.marvincloud2.link") || txt.includes("chr2")){
                    opt.disabled = false;
                    opt.selected = true;
                    opt.textContent = "CHR2 - vpn.marvincloud2.link";
                }
            });

            domain.value = ACTIVE_DOMAIN;

            const field = domain.closest(".client-paid-gen-field") || domain.parentElement;
            if(field && !field.querySelector(".client-fast-maintenance-note")){
                const note = document.createElement("div");
                note.className = "client-fast-maintenance-note";
                note.textContent = "Notice: CHR1 is under maintenance. CHR2 muna ang available target.";
                field.appendChild(note);
            }
        }

        if(submit){
            const txt = (submit.textContent || "").toLowerCase();
            if(txt.includes("generating") || txt.includes("saving")){
                submit.disabled = false;
                submit.textContent = "Generate & Push ₱300";
            }
            submit.style.pointerEvents = "auto";
            submit.style.cursor = "pointer";
        }
    }

    document.addEventListener("DOMContentLoaded", function(){
        applyFastDefaults();
        setTimeout(applyFastDefaults, 500);
    });

    document.addEventListener("click", function(e){
        const t = e.target;

        if(
            t.closest("#clientGenerateVpnBtn") ||
            t.closest("#clientPaidGenModal") ||
            t.closest("#clientAddFundBtn") ||
            t.closest("#clientFundModal") ||
            t.closest("#vpnAddressModal")
        ){
            setTimeout(applyFastDefaults, 120);
        }
    }, true);
})();
</script>
